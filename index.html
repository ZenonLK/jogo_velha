<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha P2P</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      color: #333;
    }
    h1 { margin-bottom: 10px; font-size: 1.8rem; text-align: center; }
    #status { font-weight: bold; margin-bottom: 15px; color: #555; text-align: center; padding: 0 10px; }
    
    .setup-container {
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      text-align: center;
      max-width: 90%;
    }
    input {
      padding: 8px;
      margin-right: 5px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 200px;
    }
    button {
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(3, 90px);
      gap: 5px;
      background: #333;
      padding: 5px;
      border-radius: 8px;
    }
    .cell {
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .cell.taken { cursor: not-allowed; color: #007bff; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h1>Jogo da Velha Online</h1>
  <div id="status">Conectando ao servidor...</div>

  <div class="setup-container">
    <p style="font-size: 0.9rem; margin-top: 0;">Seu ID: <b id="my-id" style="word-break: break-all;">...</b></p>
    <input type="text" id="peer-id-input" placeholder="Cole o ID do outro">
    <button id="connect-btn">Conectar</button>
  </div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const myIdEl = document.getElementById('my-id');
    const peerInput = document.getElementById('peer-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const cells = document.querySelectorAll('.cell');

    let peer = null;
    let conn = null;
    let mySymbol = '';
    let turn = 'X';
    let gameState = ['', '', '', '', '', '', '', '', ''];
    let gameActive = false;

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    peer = new Peer();

    peer.on('open', (id) => {
      myIdEl.innerText = id;
      statusEl.innerText = 'Pronto! Copie o ID e cole no outro aparelho.';
    });

    // Quem recebe a chamada é o Jogador 'O' (Host da conexão receptora)
    peer.on('connection', (c) => {
      conn = c;
      mySymbol = 'O';
      gameActive = true;
      setupConnection();
      statusEl.innerText = 'Conectado! Vez do Jogador X (Oponente).';
    });

    // Quem clica em conectar é o Jogador 'X'
    connectBtn.addEventListener('click', () => {
      const destId = peerInput.value.trim();
      if (!destId) return;
      conn = peer.connect(destId);
      mySymbol = 'X';
      gameActive = true;
      setupConnection();
      statusEl.innerText = 'Conectado! Sua vez (X).';
    });

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'MOVE') {
          applyMove(data.index, data.symbol);
        }
      });

      conn.on('close', () => {
        statusEl.innerText = 'O outro jogador desconectou.';
        gameActive = false;
      });
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = cell.getAttribute('data-index');
        
        // Valida se o jogo está ativo, se a casa está vazia e se é realmente o turno deste jogador
        if (!gameActive || gameState[index] !== '' || turn !== mySymbol) return;

        applyMove(index, mySymbol);
        conn.send({ type: 'MOVE', index: index, symbol: mySymbol });
      });
    });

    function applyMove(index, symbol) {
      gameState[index] = symbol;
      cells[index].innerText = symbol;
      cells[index].classList.add('taken');

      if (checkWin(symbol)) {
        statusEl.innerText = (symbol === mySymbol) ? 'Você venceu! 🎉' : 'Fim de jogo! Oponente venceu.';
        gameActive = false;
        return;
      }

      if (gameState.every(cell => cell !== '')) {
        statusEl.innerText = 'Empate! 🤝';
        gameActive = false;
        return;
      }

      turn = (symbol === 'X') ? 'O' : 'X';
      statusEl.innerText = (turn === mySymbol) ? `Sua vez (${mySymbol})` : `Vez do oponente (${turn})`;
    }

    function checkWin(symbol) {
      return winningConditions.some(condition => {
        return condition.every(index => gameState[index] === symbol);
      });
    }
  </script>
</body>
</html>
